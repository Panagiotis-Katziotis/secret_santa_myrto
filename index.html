<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merry Christmas</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: radial-gradient(ellipse at top, #132238 0%, #09111e 60%, #050911 100%);
      color: #f8fafc;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* Main scrollable page content */
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      /* Extra bottom padding so page content remains comfortably readable above the foreground trees */
      padding-bottom: 34vh;
    }

    /* Top / start-of-page skyline image */
    .skyline-link {
      display: block;
      width: 100%;
      max-width: 1400px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .skyline-link:hover {
      transform: scale(1.01);
      filter: drop-shadow(0 0 18px rgba(239, 68, 68, 0.45));
    }

    .skyline-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    /* Text section underneath the skyline image */
    .message-section {
      max-width: 780px;
      text-align: center;
      padding: 3rem 1.5rem 4rem;
    }

    .message-text {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.65);
    }

    /* Foreground pine trees pinned to the bottom of the screen */
    .elata-foreground {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      z-index: 20;
      pointer-events: none; /* Allows clicking and scrolling the page behind it */
    }

    .elata-foreground img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    /* Snowfall canvas overlay */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 30;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <!-- Start of the page: clickable skyline image opening exaple.com -->
    <a
      class="skyline-link"
      href="https://exaple.com"
      target="_blank"
      rel="noopener noreferrer"
      title="Click"
    >
      <img
        class="skyline-img"
        src="image.png"
        alt="image"
      />
    </a>

    <!-- Text directly under the image -->
    <section class="message-section">
      <h1 class="message-text">Καλά Χριστούγεννα και Καλή Πρωτοχρονία!</h1>
      <p>⬞</p>
      <p>⬞</p>
      <p>⬞</p>
      <p>⬞</p>
      <p>⬞</p>
      <p><h3>Αν θες να σου δώσω τη ζωγραφία πες μου να σ'την φέρω αύριο.</h3></p>
      <p><h2>Χρόνια πολλά, Μυρτώ!</h2></p>
      <p><h3>Παναγιώτης</h3></p>
    </section>
  </main>

  <!-- Fixed foreground layer at the bottom of the screen -->
  <div class="elata-foreground" aria-hidden="true">
    <img src="elata.png" alt="" />
  </div>

  <!-- Snow falling effect -->
  <canvas id="snow-canvas" aria-hidden="true"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById("snow-canvas");
      const ctx = canvas.getContext("2d");

      let width = 0;
      let height = 0;
      let flakes = [];

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function createFlake(initial) {
        const radius = Math.random() * 3.2 + 1.1;
        return {
          x: Math.random() * width,
          y: initial ? Math.random() * height : -10 - Math.random() * 40,
          r: radius,
          speedY: radius * 0.45 + Math.random() * 0.75 + 0.35,
          drift: (Math.random() - 0.5) * 0.6,
          swayAmp: Math.random() * 0.8 + 0.2,
          swaySpeed: Math.random() * 0.02 + 0.008,
          angle: Math.random() * Math.PI * 2,
          opacity: Math.min(0.95, radius / 4 + 0.25)
        };
      }

      function initFlakes() {
        const count = Math.min(220, Math.max(90, Math.floor((width * height) / 9000)));
        flakes = Array.from({ length: count }, () => createFlake(true));
      }

      function updateAndDraw() {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          f.angle += f.swaySpeed;
          f.y += f.speedY;
          f.x += f.drift + Math.sin(f.angle) * f.swayAmp;

          if (f.y > height + 10) {
            flakes[i] = createFlake(false);
            continue;
          }
          if (f.x > width + 10) f.x = -10;
          if (f.x < -10) f.x = width + 10;

          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${f.opacity})`;
          ctx.fill();
        }

        requestAnimationFrame(updateAndDraw);
      }

      window.addEventListener("resize", () => {
        resize();
        initFlakes();
      });

      resize();
      initFlakes();
      requestAnimationFrame(updateAndDraw);
    })();
  </script>
</body>
</html>
